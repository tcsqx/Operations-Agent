version: '3.8'

services:
  opspilot:
    build:
      context: .
      dockerfile: Dockerfile
    image: opspilot:2.0.0
    container_name: opspilot-service
    restart: unless-stopped
    ports:
      - "9900:9900"
    environment:
      - SERVER_PORT=9900
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY:-your-api-key-here}
      - PROMETHEUS_BASE_URL=http://prometheus:9090
      - PROMETHEUS_MOCK_ENABLED=false
      - SPRING_AI_MCP_ENABLED=false
      - TZ=Asia/Shanghai
    volumes:
      - opspilot-logs:/app/logs
      - opspilot-uploads:/app/uploads
    networks:
      - opspilot-net
    depends_on:
      - prometheus
      - alertmanager

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: opspilot-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    networks:
      - opspilot-net

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: opspilot-alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./deploy/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks:
      - opspilot-net

networks:
  opspilot-net:
    driver: bridge

volumes:
  opspilot-logs:
  opspilot-uploads:
  prometheus-data:
  alertmanager-data:
