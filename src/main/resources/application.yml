server:
  port: 9900
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

file:
  upload:
    path: ./uploads
    allowed-extensions: txt,md

milvus:
  host: localhost
  port: 19530
  username: ""
  password: ""
  database: default
  timeout: 5000

# Spring AI Alibaba DashScope 配置
spring:
  config:
    import: optional:classpath:application-local.yml
  datasource:
    url: jdbc:h2:mem:opspilot;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
  ai:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:your-api-key-here}  # 从环境变量或 application-local.yml 读取
      chat:
        options:
          model: qwen3.8-flash
          timeout: 180000  # 超时时间180秒（3分钟）
      retry:
        max-attempts: 3  # 最大重试次数
        backoff:
          initial-interval: 2000  # 初始重试间隔2秒
          multiplier: 2  # 重试间隔倍数
          max-interval: 10000  # 最大重试间隔10秒
    
    # Spring AI MCP 客户端配置（stdio本地模式）
    mcp:
      client:
        enabled: ${SPRING_AI_MCP_ENABLED:false}
        name: tencent-cls
        version: 1.0.0
        request-timeout: 60s
        type: ASYNC
        stdio:
          command: npx.cmd
          args:
            - -y
            - "@tencentcloud/cls-mcp-server"
          env:
            TENCENTCLOUD_SECRET_ID: ${TENCENTCLOUD_SECRET_ID:your-secret-id-here}
            TENCENTCLOUD_SECRET_KEY: ${TENCENTCLOUD_SECRET_KEY:your-secret-key-here}

# 阿里云 DashScope Embedding API 配置
dashscope:
  api:
    key: ${DASHSCOPE_API_KEY:your-api-key-here}  # 从环境变量或 application-local.yml 读取
  embedding:
    model: qwen3.7-text-embedding  # 阿里云文本向量化模型

# 文档分片配置
document:
  chunk:
    max-size: 800  # 每个分片最大字符数
    overlap: 100   # 分片之间的重叠字符数

# RAG 配置
rag:
  top-k: 3  # 检索返回的最相似文档数量
  model: "qwen3.8-flash"  # 大语言模型名称（当前账号 qwen3.8-flash 拥有可用额度）

# Prometheus 配置
prometheus:
  base-url: http://localhost:9090
  timeout: 10  # 超时时间（秒）
  mock-enabled: ${PROMETHEUS_MOCK_ENABLED:true}  # 是否启用 Mock 模式（本地未部署 Prometheus 9090 时默认启用）

# CLS 云日志服务配置
cls:
  mock-enabled: ${CLS_MOCK_ENABLED:true}  # 是否启用 Mock 模式（设为 true 返回与告警关联的模拟日志数据）
